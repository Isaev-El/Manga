# Запуск всего вместе: docker compose up --build
# Catalog API:  http://localhost:5100/scalar
# Postgres:     localhost:5433 (5433, чтобы не конфликтовать с локально установленным Postgres на 5432)

services:
  catalog-db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: manga_catalog
    ports:
      - "5433:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d manga_catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog-api:
    build:
      context: .
      dockerfile: src/Services/Catalog/Catalog.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # чтобы работал Scalar
      ConnectionStrings__Catalog: "Host=catalog-db;Port=5432;Database=manga_catalog;Username=postgres;Password=postgres"
    ports:
      - "5100:8080"
    depends_on:
      catalog-db:
        condition: service_healthy   # ждём, пока база реально начнёт принимать подключения

volumes:
  catalog-db-data:
